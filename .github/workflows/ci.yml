name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.12
      - name: System deps (ffmpeg for the audio-timing golden test)
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - name: Install
        run: uv sync --extra dev --extra arena
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Test
        # tests that need live API keys skip themselves when the keys are absent
        run: uv run pytest -q
