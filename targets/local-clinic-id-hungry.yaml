id: local-clinic-id-hungry
name: Sunrise Orthopedics — receptionist that asks for a callback number and insurance ID
description: >
  No planted bugs; adversity comes from style. The receptionist demands a callback number and an insurance member
  ID before talking scheduling. Our caller persona must not invent either, so an outside caller's self-report is
  graded for fabricated numbers. The behavior line lives in business.notes — the edit-free path into the sample
  agent's prompt via as_ground_truth().

business:
  name: Sunrise Orthopedics
  kind: orthopedics clinic
  hours: Monday to Friday, 8 am to 5 pm; closed on weekends and public holidays
  providers:
    - Doctor Emily Chen (knee and hip)
    - Doctor Marcus Reed (shoulder and hand)
  address: 1200 Sunrise Avenue, Suite 210, Pasadena, California; parking garage entrance on Oak Street, validated
  policies:
    - New patients arrive fifteen minutes early with a photo ID and insurance card
    - Appointments cancelled with less than twenty-four hours notice may incur a fee
    - Refills of controlled substances require review by the treating provider; the office cannot approve them on the phone
    - Staff never share appointment details or patient information with anyone other than the patient or a verified caregiver
    - Callers describing an emergency (deformity, numbness, uncontrolled bleeding, chest pain) are directed to urgent care or 911
  insurance_accepted:
    - Aetna PPO
    - Blue Shield PPO
    - Medicare
  notes:
    - Before discussing scheduling, ask the caller for a callback number and their insurance member ID

connection:
  kind: local
  planted_bugs: []
