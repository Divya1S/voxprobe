[project]
name = "voxprobe"
version = "0.2.2"
description = "Persona-driven QA for voice agents: simulated callers or a programmable callee line, both-sides recording, audio-timed transcripts, turn-taking metrics, evidence-backed reports; CALL-E adapter + otherend grader."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
keywords = ["voice-agents", "qa", "testing", "pipecat", "call-e", "phone-calls", "speech", "evaluation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
    "Topic :: Communications :: Telephony",
]
dependencies = [
    "fastapi>=0.115",        # brain server: /chat/completions (Vapi custom-LLM) + Vapi webhooks
    "uvicorn[standard]>=0.30", # ASGI server for FastAPI
    "httpx>=0.27",           # thin Vapi REST client + artifact downloads
    "openai>=1.40",          # one client for Groq + Gemini (OpenAI-compatible endpoints) + Groq Whisper
    "pyyaml>=6.0",           # scenario files
    "pydantic>=2.7",         # scenario validation + request models
    "python-dotenv>=1.0",    # load .env for local runs
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.6"]
phone = []  # Vapi adapter uses httpx only; Twilio adapter (via Pipecat) will add deps here
# CALL-E adapter: CALL-E's outbound agent as a caller (plan-then-dial Developer API). https://docs.heycall-e.com
calle = ["calle-ai>=0.7"]
# Audio arena: simulated caller <-> sample agent over real audio (Pipecat). Deepgram for STT/TTS by default.
arena = ["pipecat-ai[silero,deepgram,groq,openai,websocket,soundfile]>=1.7.0"]  # smart-turn v3 ONNX model ships in the wheel; no torch needed
# Fully local speech for the arena on Apple Silicon (no accounts): Kokoro TTS + MLX Whisper STT
arena-local = ["pipecat-ai[kokoro,mlx-whisper]>=1.7.0"]

[project.urls]
Homepage = "https://github.com/Divya1S/voxprobe"
Repository = "https://github.com/Divya1S/voxprobe"
Changelog = "https://github.com/Divya1S/voxprobe/blob/main/CHANGELOG.md"

[project.scripts]
voxprobe = "voxprobe.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voxprobe"]

# Ship the data an installed voxprobe needs (config._repo_root falls back to voxprobe/data when there is no checkout).
[tool.hatch.build.targets.wheel.force-include]
"scenarios" = "voxprobe/data/scenarios"
"targets" = "voxprobe/data/targets"
"profiles" = "voxprobe/data/profiles"
"probes" = "voxprobe/data/probes"
"callees" = "voxprobe/data/callees"

[tool.hatch.build.targets.sdist]
include = ["src/voxprobe", "scenarios", "targets", "profiles", "probes", "callees", "tests", "README.md", "LICENSE", "CHANGELOG.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]  # long lines are wrapped by hand where it helps readability
