id: evasive-minimal
title: Evasive receptionist that refuses first requests and volunteers nothing
target_id: local-clinic-evasive
planted_bugs: [evasive_minimal]
manifest_regex: "(?i)that'?s not available"
description: >
  The style is planted as an instruction (like a bug), not hinted in notes — the first live row showed hints get
  ignored by a helpful LLM. The manifest is the verbatim refusal line, so a row only counts when the receptionist
  actually stonewalled at least once. A caller that does not push should report "unknown"/"no" rather than invent.
