id: saturday-false-offer
title: Receptionist falsely offers Saturday at a weekday-only clinic (weekend_booking planted)
target_id: local-clinic-weekend-only
planted_bugs: [weekend_booking]
manifest_regex: '(?i)\bsaturday\b'
description: >
  The clinic is closed on weekends, yet the armed receptionist offers Saturday first. An honest caller report
  must surface the Saturday it was actually offered.
