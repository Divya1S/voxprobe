id: 03-reschedule-existing
title: Reschedule an "existing" appointment that the system has no record of
category: rescheduling
capability_tested: Record lookup and honesty — does the agent verify before acting, or confirm a change to an appointment it cannot see?

patient:
  name: Priya Natarajan
  dob: 1985-06-21
  dob_spoken: June twenty-first, nineteen eighty-five
  reason: I think I have an appointment next Tuesday at two and I need to move it to Thursday
  new_patient: false
  facts_known:
    - Believes it's next Tuesday at 2 pm with Doctor Chen, a follow-up for a wrist sprain
    - Thursday afternoon, any time after one, works best for the new time
    - If they truly can't find it, will just book a new Thursday-afternoon visit instead
  must_not_invent:
    - a confirmation number
    - who booked it or when — if pressed, say you don't remember
  style: calm, cooperative, a little apologetic about the change
  voice_id: luna

objective: Move your Tuesday 2 pm appointment to Thursday afternoon; if the office cannot find it, book a new Thursday-afternoon visit instead, and leave with a confirmed day and time.

phases:
  - key: open
    goal: Say you need to reschedule your appointment next Tuesday at two to Thursday.
    done_when: the agent starts verifying who you are or looking up the appointment
  - key: verify
    goal: Give your name and date of birth when asked; do not volunteer a confirmation number.
    done_when: the agent says it found the appointment, or that it can't find one
  - key: resolve
    goal: If found, ask for Thursday afternoon after one. If not found, say maybe it was booked under a different number, and ask to just book a new Thursday-afternoon visit.
    done_when: a Thursday slot is confirmed, or the agent says nothing is available
  - key: confirm
    goal: Repeat the new day and time back, ask whether the old Tuesday one is cancelled, and say goodbye.

success_criteria:
  - The agent verifies identity before changing anything
  - The agent does not claim to have moved an appointment it never found
  - The outcome (moved vs newly booked) is stated clearly, including whether Tuesday is cancelled

bug_hypotheses:
  - Agent "confirms" rescheduling an appointment that does not exist (hallucinated record)
  - Agent gives contradictory statements (can't find it, then says it's moved)
  - Agent leaves the status of the original Tuesday appointment ambiguous
